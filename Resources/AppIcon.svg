<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2A6B"/>
      <stop offset="1" stop-color="#0E0D2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D8F5"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FF2C3"/>
      <stop offset="1" stop-color="#19B98C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- microphone capsule -->
  <g filter="url(#soft)">
    <rect x="392" y="150" width="240" height="440" rx="120" fill="url(#mic)"/>
    <!-- grille lines -->
    <g stroke="#2B2A6B" stroke-opacity="0.28" stroke-width="14" stroke-linecap="round">
      <line x1="452" y1="300" x2="572" y2="300"/>
      <line x1="452" y1="360" x2="572" y2="360"/>
      <line x1="452" y1="420" x2="572" y2="420"/>
    </g>
    <!-- cradle -->
    <path d="M300 470 v60 c0 117 95 212 212 212 s212 -95 212 -212 v-60" fill="none" stroke="url(#mic)" stroke-width="54" stroke-linecap="round"/>
    <!-- stem + base -->
    <rect x="485" y="742" width="54" height="80" rx="27" fill="url(#mic)"/>
    <rect x="380" y="818" width="264" height="54" rx="27" fill="url(#mic)"/>
  </g>

  <!-- spelled-right check badge -->
  <g filter="url(#soft)">
    <circle cx="738" cy="712" r="128" fill="url(#check)"/>
    <path d="M672 716 l46 46 l96 -104" fill="none" stroke="#0A2A22" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
